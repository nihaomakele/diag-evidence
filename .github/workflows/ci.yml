name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      TMPDIR: ${{ github.workspace }}/.ci/tmp
      DIAG_EVIDENCE_REPORTS_DIR: ${{ github.workspace }}/.ci/reports
      DIAG_EVIDENCE_LOGS_DIR: ${{ github.workspace }}/.ci/logs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"
      - name: Install core package
        run: python -m pip install .
      - name: Unit and loopback HTTP integration tests
        run: python -m unittest discover -s diag_evidence/tests -t . -v
      - name: Offline scenario smoke test
        run: diag-evidence demo --scenario all --no-write
      - name: Online patrol smoke test
        run: diag-evidence patrol-demo --scenario mixed --seed 7 --no-write

  distributions:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      TMPDIR: ${{ github.workspace }}/.ci/tmp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
          python scripts/check_release.py dist
      - name: Install wheel into a fresh environment outside the source checkout
        run: |
          python -m venv "$RUNNER_TEMP/diag-evidence-wheel-env"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/diag-evidence" demo --scenario all --no-write
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/diag-evidence" patrol-demo --scenario mixed --seed 7 --output-dir "$RUNNER_TEMP/patrol-replay"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -c "from importlib.resources import files; assert files('diag_evidence.patrol').joinpath('replay_template.html').is_file()"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -c "from importlib.resources import files; assert files('diag_evidence').joinpath('skills/fault_diagnosis.md').is_file()"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -m pip check
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -c "from importlib.metadata import version; import diag_evidence; assert version('diag-evidence') == diag_evidence.__version__"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -c "from diag_evidence import DiagnosisAgent, Settings; from diag_evidence.demo import SyntheticTransport, synthetic_signal; result = DiagnosisAgent(config=Settings(), transport=SyntheticTransport('consistent'), persist_trace=False).run(synthetic_signal(), skip_services_check=True); assert result['terminal_state'] == 'COMPLETED'; assert result['effective_strength'] == 'moderate'"
          "$RUNNER_TEMP/diag-evidence-wheel-env/bin/python" -c "from importlib.util import find_spec; from pathlib import Path; import sys; assert find_spec('harness_agent') is None; assert not Path(sys.executable).with_name('harness-agent').exists()"
      - name: Build again from the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/diag-evidence-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/diag-evidence-sdist"
          cd "$RUNNER_TEMP"/diag-evidence-sdist/diag_evidence-*
          python -m build --wheel
