[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diag-evidence"
version = "0.1.1"
description = "Contract checks, conclusion constraints and replayable evaluation for vibration diagnostic workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "nihaomakele"}]
keywords = ["diagnostics", "evidence", "reproducibility", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24,<3", "requests>=2.31,<3"]

[project.urls]
Repository = "https://github.com/nihaomakele/diag-evidence"
Issues = "https://github.com/nihaomakele/diag-evidence/issues"

[project.optional-dependencies]
demo = ["flask>=3,<4"]
data = ["pandas>=2,<3"]
plots = ["matplotlib>=3.7,<4", "PyWavelets>=1.4,<2"]

[project.scripts]
diag-evidence = "diag_evidence.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["diag_evidence*"]
exclude = ["diag_evidence.tests*"]

[tool.setuptools.package-data]
diag_evidence = ["skills/*.md"]
